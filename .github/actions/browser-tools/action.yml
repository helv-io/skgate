name: Browser test tools
description: Installs jsdom and puppeteer-core and points the browser tests at them and at the runner's Chrome, so they run instead of being skipped. The same script a developer runs (tools/browser-env.sh).
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SKGATE_BROWSER_CACHE: ${{ runner.temp }}/browser
      run: tools/browser-env.sh --github-env
