# Build, vet and test on every push to the default branch and every pull request (same checks as tools/chk.sh).
# Skipped for changes that cannot affect the code or its tests. README.md, docs/ and AGENT.md are NOT skipped:
# tests read them.

name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - ROADMAP.md
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore:
      - ROADMAP.md
      - LICENSE
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and vet run with shard 1; the slow internal/app tests are dealt out to the shards (tools/test-shard.sh).
  check:
    name: check (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
      - run: tools/test-shard.sh ${{ matrix.shard }} 3
