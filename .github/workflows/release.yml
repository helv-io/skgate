# Publishes ghcr.io/<owner>/skgate on every version tag (v*), linux/amd64 and linux/arm64.
#
# Two Dockerfile targets:
#   full (default)  vX.Y.Z  X.Y.Z  latest  <sha12>
#   slim            vX.Y.Z-slim  X.Y.Z-slim  slim  <sha12>-slim
#
# How it runs:
#   test    go build, vet and test in three shards (tools/test-shard.sh), in parallel with the builds.
#   build   four jobs (full and slim, each on a native amd64 and a native arm64 runner, no emulation) push their image
#           by digest only, with no tag, and keep their layers in a registry cache that every ref can read.
#   merge   after test AND build succeeded: puts the tags on one multi-arch manifest per variant. Until this job runs
#           nothing is tagged, so a failing test never publishes.
#
# A manual run (workflow_dispatch) does the same but tags the result ci-test-<run id> (and ci-test-<run id>-slim)
# only, never a version, latest or slim, so a change to this file can be proven without releasing.
#
#   github-release after test, on a stable vX.Y.Z tag: creates the GitHub Release page with generated notes.
#                  An existing page is left alone, so a re-run succeeds. It does not wait for the images.
#   mcp-registry   after merge, on stable tags only: lists server.json in the official MCP registry through GitHub OIDC.
#
# Uses the built-in GITHUB_TOKEN; no other secret is needed.
# The first push creates the package; set its visibility under the repository's Packages settings.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A second run on the same ref replaces the first, except for tags: a release is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CACHE: ghcr.io/${{ github.repository }}-buildcache
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
  # A pre-release tag such as v1.0.0-rc1 does not move latest / slim.
  STABLE: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-test-{0}', github.run_id) }}

jobs:
  test:
    name: test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
      - uses: ./.github/actions/browser-tools
      - run: tools/test-shard.sh ${{ matrix.shard }} 3

  build:
    name: build ${{ matrix.variant }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { variant: full, sfx: '', arch: amd64, runner: ubuntu-latest }
          - { variant: full, sfx: '', arch: arm64, runner: ubuntu-24.04-arm }
          - { variant: slim, sfx: -slim, arch: amd64, runner: ubuntu-latest }
          - { variant: slim, sfx: -slim, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        run: echo "sha12=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # Only for the labels: the same inputs as the merge job, so the labels match the tags.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}${{ matrix.sfx }}
            type=semver,pattern={{version}},suffix=${{ matrix.sfx }}
            type=raw,value=${{ matrix.variant == 'slim' && 'slim' || 'latest' }},enable=${{ env.STABLE }}
            type=raw,value=${{ steps.vars.outputs.sha12 }}${{ matrix.sfx }},enable=${{ env.IS_TAG }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.CACHE }}:${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.CACHE }}:${{ matrix.variant }}-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
          provenance: false
          sbom: false

      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          # amd64.<hex> sorts before arm64.<hex>, so the manifest lists the platforms in the same order as before
          touch "$RUNNER_TEMP/digests/${{ matrix.arch }}.${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: tag ${{ matrix.variant }}
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { variant: full, sfx: '' }
          - { variant: slim, sfx: -slim }
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: echo "sha12=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}${{ matrix.sfx }}
            type=semver,pattern={{version}},suffix=${{ matrix.sfx }}
            type=raw,value=${{ matrix.variant == 'slim' && 'slim' || 'latest' }},enable=${{ env.STABLE }}
            type=raw,value=${{ steps.vars.outputs.sha12 }}${{ matrix.sfx }},enable=${{ env.IS_TAG }}

      - name: Tag one multi-arch manifest from the per-arch images
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for f in *; do printf '${{ env.IMAGE }}@sha256:%s ' "${f#*.}"; done)
      - run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ env.VERSION }}${{ matrix.sfx }}

  # After the tests pass, create the GitHub Release for this tag. Stable vX.Y.Z only, never a manual run
  # or a pre-release (same guard as mcp-registry). It does not wait for the images. action-gh-release appends
  # generated notes when it updates, so a tag that already has a release is left as it is and the job succeeds.
  github-release:
    name: GitHub Release
    needs: [test]
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Stable vX.Y.Z only
        id: stable
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Not a stable version tag: $GITHUB_REF_NAME"; fi
      - name: Release already exists
        id: existing
        if: steps.stable.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the GitHub Release
        if: steps.stable.outputs.ok == 'true' && steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true

  # After the images are tagged, list this version in the official MCP registry (server.json). GitHub OIDC proves the
  # repository owner, which grants io.github.helv-io/*; no secret and no user token. Stable tags only, never a manual run.
  # The job fails when server.json does not match the tag, and skips when the registry already has the version.
  # Pinned mcp-publisher: to move it, take the version and the linux_amd64 tarball's sha256 from
  # https://github.com/modelcontextprotocol/registry/releases and change both below.
  mcp-registry:
    name: publish to the MCP registry
    needs: [merge]
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v7

      - name: server.json matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(jq -r .version server.json)"
          if [ "$have" != "$want" ]; then
            echo "::error file=server.json::version is $have but the tag is $GITHUB_REF_NAME; bump server.json with Version and tag again"
            exit 1
          fi
          bad="$(jq -r --arg v "$want" '.packages[].identifier | select((endswith(":" + $v) or endswith(":" + $v + "-slim")) | not)' server.json)"
          if [ -n "$bad" ]; then
            echo "::error file=server.json::package identifiers must end in :$want or :$want-slim, found: $bad"
            exit 1
          fi

      - id: listed
        name: Is this version already in the registry
        run: |
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/${name//\//%2F}/versions/$version")"
          case "$code" in
            200) echo "::notice::$name $version is already in the MCP registry; nothing to publish"; echo "listed=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "listed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::the registry answered $code when asked for $name $version"; exit 1 ;;
          esac

      - name: Install mcp-publisher ${{ env.MCP_PUBLISHER_VERSION }}
        if: steps.listed.outputs.listed != 'true'
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        if: steps.listed.outputs.listed != 'true'
        run: ./mcp-publisher validate server.json

      - name: Log in with GitHub OIDC
        if: steps.listed.outputs.listed != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: steps.listed.outputs.listed != 'true'
        run: ./mcp-publisher publish
