{{define "layout"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} - skgate</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/admin/static/app.css"></head><body>
{{if .CSRF}}<header><span class="brand"><img src="/favicon.svg" alt="" width="18" height="18">skgate</span>
<a href="/admin" class="{{if eq .Nav "status"}}on{{end}}">status</a>
<a href="/admin/keys" class="{{if eq .Nav "keys"}}on{{end}}">keys</a>
<a href="/admin/upstreams" class="{{if eq .Nav "upstreams"}}on{{end}}">mcp upstreams</a>
<a href="/admin/clients" class="{{if eq .Nav "clients"}}on{{end}}">oauth clients</a>
<span class="ver">v{{.Version}}</span>{{if .User}}<span class="who">{{.User}}</span>{{end}}<form method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="act plain">logout</button></form></header>{{end}}
<main>
{{template "body" .}}</main>{{if .Toasts}}<div class="toasts">{{range .Toasts}}<div class="toast {{.Kind}}">{{.Msg}}</div>{{end}}</div>{{end}}{{if .CSRF}}{{template "modal"}}{{end}}<script src="/admin/static/app.js"></script></body></html>{{end}}
